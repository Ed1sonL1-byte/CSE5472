[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "seedbridge"
version = "0.1.0"
description = "Stage 1 reachability integration for two local teaching state machines"
requires-python = ">=3.12,<3.13"
dependencies = ["halmos==0.3.3", "crytic-compile==0.3.11"]

[project.scripts]
seedbridge = "seedbridge.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/seedbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = ["integration: invokes native EVM tools"]
